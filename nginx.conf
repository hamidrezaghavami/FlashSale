# The configuration file that tells Nginx how to load-balance 
# incoming traffic across your multiple Node.js API containers.
user nginx;
worker_processes auto;
pid /run/nginx.id;
error_log /var/log/nginx/error.log warn;

event { 
    worker_connections 1024;
    multi_accept on;
}

http { 
    include /etc/nginx/mime.type
    default_type application/octect-stream

    upstream node_api_cluster { 
        server api-1:3000;
        server api-2:3000;
    }
}

server { 
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Forward all incoming traffic to our API cluster
    location / { 
    proxy_pass http://node_api_cluster;

    # Standard proxy headers to preserve client metadata
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # High-throughput tuning for flash sale spikes
    proxy_http_version 1.1;
    proxy_set_header connection "";
    }
}