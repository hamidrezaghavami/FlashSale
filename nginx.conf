# The configuration file that tells Nginx how to load-balance 
# incoming traffic across your multiple Node.js API containers.
user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { 
    worker_connections 1024;
    multi_accept on;
}

http { 
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream node_api_cluster { 
        server api-1:3000;
        server api-2:3000;
    }

    # The server block MUST be inside the http block!
    server { 
        listen 80;
        listen [::]:80;
        server_name localhost;

        location / { 
            proxy_pass http://node_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header connection "";
        }
    }
}