# The master blueprint that launches and connects Nginx, 
# Kafka, your Node.js apps, and your PostgreSQL database in their own containers.
version: '3.8'

services:
  # 1. The Database: PostgreSQL (Source of Truth)
  postgres:
    image: postgres:15-alpine
    container_name: db_container
    environment:
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: sales_password
      POSTGRES_DB: flashsale_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. Zookeeper: Manages the Kafka cluster state
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_container
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network
# kafka: the shock absorbing queue
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_container
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network
# API Instance 1: The Producer
  api-1: 
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_container_1
    environment:
      - NODE_ENV=production
      - PORT=3000
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    networks:
      - app-network
# API Instance 2: The Producer
  api-2:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_container_2
    environment:
      - NODE_ENV=production
      - PORT=3000
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    networks:
      - app-network
# Worker App: The Consumer
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - KAFKA_BROKER=kafka:9092
      - DATABASE_URL=postgresql://sales_user:sales_password@postgres:5432/flashsale_db
    depends_on:
      - kafka
      - postgres
    networks:
      - app-network
# Nginx: The Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nginx_container
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: